name: Build and Deploy

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # If you wanted to login to a registry (like Docker Hub or GHCR), you would do it here:
      # - name: Login to Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false # Set to true if you are pushing to a registry
          tags: user-service:latest
          # Secrets are NOT needed at build time unless you use correct --secret mount in Dockerfile.
          # But for runtime, you just need to ensure the container receives them.
          # This example shows how you MIGHT pass build arguments if needed,
          # but for environment variables, those are typically injected at RUNTIME (deployment).

      - name: Run Build Verification
        # This step mimics "running" the container to verify it can start.
        # We pass secrets as environment variables here.
        # Note: 'timeout 30s' is used because the app starts a server and doesn't exit.
        run: |
          docker build -t user-service .
          docker run -d --name test-container \
            -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            -p 3000:3000 \
            user-service

          echo "Waiting for container to start..."
          sleep 10

          # Check if container is still running
          if [ "$(docker inspect -f '{{.State.Running}}' test-container)" = "true" ]; then
            echo "Container started successfully!"
            docker stop test-container
          else
            echo "Container failed to start."
            docker logs test-container
            exit 1
          fi
